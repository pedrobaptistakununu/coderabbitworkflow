name: Comment on Commits

on:
  pull_request:

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Check for open pull request
        id: check_pr
        run: |
          pr_number=$(gh pr list --state open --json number,headRef | jq -r ".[] | select(.headRef==\"${GITHUB_REF##*/}\") | .number")
          echo "pr_number=$pr_number" >> $GITHUB_ENV

      - name: Comment on PR
        if: env.pr_number != ''
        run: |
          echo "Commenting on PR #${{ env.pr_number }}"
          gh pr comment ${{ env.pr_number }} --body "@coderabbitai review"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail if no PR exists
        if: env.pr_number == ''
        run: |
          echo "No open PR found for this commit. No comment was made."